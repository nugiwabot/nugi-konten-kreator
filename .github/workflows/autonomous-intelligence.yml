name: Autonomous Intelligence Regression

on:
  pull_request:
    paths:
      - "engine/**"
      - "mcp/**"
      - "tests/test_autonomous_intelligence.py"
      - "tests/test_research_dossier.py"
      - "tests/test_narrative_integrity.py"
      - "tests/test_visual_media_plan.py"
      - "tests/test_final_qa_stage10.py"
      - "tests/test_production_orchestrator_e2e.py"
      - "tests/test_script_auditor.py"
      - "tests/conftest.py"
      - ".github/workflows/autonomous-intelligence.yml"
  push:
    branches:
      - main
      - "feat/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal regression dependency
        run: python -m pip install python-dotenv pytest

      - name: Compile Python sources
        run: python -m compileall -q engine mcp tests/test_autonomous_intelligence.py tests/test_research_dossier.py tests/test_narrative_integrity.py tests/test_script_auditor.py tests/test_visual_media_plan.py tests/test_final_qa_stage10.py tests/test_production_orchestrator_e2e.py

      - name: Run autonomous intelligence regression
        run: python -m unittest discover -s tests -p "test_autonomous_intelligence.py" -v

      - name: Run research dossier regression
        run: python -m pytest -q tests/test_research_dossier.py

      - name: Run narrative integrity regression
        run: python -m pytest -q tests/test_narrative_integrity.py

      - name: Run visual media plan regression
        run: python -m pytest -q tests/test_visual_media_plan.py

      - name: Run production final QA integration regression
        run: python -m pytest -q tests/test_final_qa_stage10.py

      - name: Run production orchestrator end-to-end regression
        run: python -m pytest -q tests/test_production_orchestrator_e2e.py
